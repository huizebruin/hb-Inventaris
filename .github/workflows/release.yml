name: release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest

      - name: Versie moet kloppen met de tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(python -c "import re;print(re.search(r\"APP_VERSION\s*=\s*'([^']+)'\", open('server.py').read()).group(1))")
          echo "tag=$TAG app=$APP"
          [ "$TAG" = "$APP" ] || { echo "::error::Tag $TAG komt niet overeen met APP_VERSION $APP in server.py"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release-notities (NL + EN) uit de changelogs
        run: |
          V="${{ steps.ver.outputs.version }}"
          sect() { awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' "$1"; }
          sect CHANGELOG.md > nl.md
          sect CHANGELOG.en.md > en.md
          [ -s nl.md ] || { echo "::error::Geen sectie [$V] in CHANGELOG.md"; exit 1; }
          [ -s en.md ] || { echo "::error::No section [$V] in CHANGELOG.en.md"; exit 1; }
          { echo "## 🇬🇧 English"; cat en.md; echo; echo "---"; echo; echo "## 🇳🇱 Nederlands"; cat nl.md; } > notes.md
          cat notes.md

      - name: Zip maken
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          git archive --format=zip --prefix="hb-inventaris-$V/" -o "dist/hb-inventaris-$V.zip" HEAD
          (cd dist && sha256sum "hb-inventaris-$V.zip" > "hb-inventaris-$V.zip.sha256")

      - name: GitHub-release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" dist/* --title "HB Inventaris $V" --notes-file notes.md --target "$GITHUB_SHA"
