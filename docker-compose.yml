services:
  hb-inventaris:

    build: .
    container_name: inventaris
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data        # Database, .env, backups config
      - ./media:/app/media      # Geüploade afbeeldingen en PDFs
      - ./backups:/app/backups  # Automatische dagelijkse backups
      - ./static:/app/static
    environment:
      - TZ=Europe/Amsterdam

    labels:
      - "com.centurylinklabs.watchtower.enable=true"  # Automatische updates via Watchtower

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
